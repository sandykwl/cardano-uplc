name: cardano-uplc-crypto

"on":
  push:
    branches: [main]
    paths:
      - "cardano-uplc-crypto/**"
      - "src/**"
      - "cardano-uplc.cabal"
      - "cabal.project"
      - ".github/workflows/cardano-uplc-crypto.yml"
  pull_request:
    branches: [main]
    paths:
      - "cardano-uplc-crypto/**"
      - "src/**"
      - "cardano-uplc.cabal"
      - "cabal.project"
      - ".github/workflows/cardano-uplc-crypto.yml"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      newest: ${{ steps.newest.outputs.matrix }}
    steps:
      - id: set-matrix
        uses: kleidukos/get-tested@v0.1.10.0
        with:
          cabal-file: cardano-uplc-crypto/cardano-uplc-crypto.cabal
          ubuntu-version: "latest"
          macos-version: "latest"
          windows-version: "latest"
          version: 0.1.10.0

      - id: newest
        uses: kleidukos/get-tested@v0.1.10.0
        with:
          cabal-file: cardano-uplc-crypto/cardano-uplc-crypto.cabal
          ubuntu-version: "latest"
          newest: true
          version: 0.1.10.0

  build:
    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libsodium and the build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config autoconf automake libtool

      - name: Install libsodium and the build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium pkg-config autoconf automake libtool

      - name: Cache libsecp256k1
        if: runner.os != 'Windows'
        id: secp-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: libsecp256k1-0.3.2-${{ runner.os }}-${{ runner.arch }}

      - name: Build libsecp256k1 v0.3.2
        if: runner.os != 'Windows' && steps.secp-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch v0.3.2 --depth 1 https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          ./autogen.sh
          ./configure --prefix="$HOME/.local" --disable-shared --with-pic \
            --enable-module-schnorrsig --enable-module-extrakeys \
            --disable-benchmark --disable-tests --disable-exhaustive-tests
          make -j2
          make install

      - name: Point pkg-config at libsecp256k1
        if: runner.os != 'Windows'
        run: echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install libsodium and libsecp256k1 (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-libsecp256k1

      - name: Point pkg-config at the MSYS2 libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "${{ steps.msys2.outputs.msys2-location }}\mingw64"
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.12.1.0"

      - run: cabal build all
        working-directory: cardano-uplc-crypto
      - run: cabal test all
        working-directory: cardano-uplc-crypto

  quality:
    needs: generate-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config autoconf automake libtool
      - id: secp-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: libsecp256k1-0.3.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.secp-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch v0.3.2 --depth 1 https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          ./autogen.sh
          ./configure --prefix="$HOME/.local" --disable-shared --with-pic \
            --enable-module-schnorrsig --enable-module-extrakeys \
            --disable-benchmark --disable-tests --disable-exhaustive-tests
          make -j2
          make install
      - run: echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ fromJSON(needs.generate-matrix.outputs.newest).include[0].ghc }}
          cabal-version: "3.12.1.0"

      - name: Haddock coverage is 100%
        run: |
          set -o pipefail
          cd cardano-uplc-crypto
          cabal haddock lib:cardano-uplc-crypto 2>&1 | tee haddock.log
          ! grep -E '^ *[0-9]{1,2}% ' haddock.log

      - name: Every module carries @since
        run: '! grep -rL "@since" cardano-uplc-crypto/src --include="*.hs" --include="*.hsc" | grep .'

      - name: Package metadata is clean
        run: cd cardano-uplc-crypto && cabal check | grep -q 'No errors or warnings'

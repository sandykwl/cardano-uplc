name: cardano-uplc

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The GHC versions are read from `tested-with`, so they are declared once, in
  # the cabal file. The runners are listed here: every Tier 1 GHC platform.
  # x86_64 darwin is macos-15-intel: the macos-13 image has been retired, and
  # jobs asking for it queue until the 24-hour timeout kills them.
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      newest: ${{ steps.newest.outputs.matrix }}
    steps:
      - id: set-matrix
        uses: kleidukos/get-tested@v0.1.10.0
        with:
          cabal-file: cardano-uplc.cabal
          ubuntu-version: "latest, 24.04-arm"
          macos-version: "15-intel, 14"
          windows-version: "latest"
          version: 0.1.10.0

      # The quality gates need one GHC, not every one: the newest, on Linux.
      - id: newest
        uses: kleidukos/get-tested@v0.1.10.0
        with:
          cabal-file: cardano-uplc.cabal
          ubuntu-version: "latest"
          newest: true
          version: 0.1.10.0

  build:
    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.12.1.0"
      - run: cabal build all
      - run: cabal test all

  quality:
    needs: generate-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ fromJSON(needs.generate-matrix.outputs.newest).include[0].ghc }}
          cabal-version: "3.12.1.0"

      # Fails if any module reports 0%-99% (two digits or fewer).
      - name: Haddock coverage is 100%
        run: |
          set -o pipefail
          cabal haddock lib:cardano-uplc 2>&1 | tee haddock.log
          ! grep -E '^ *[0-9]{1,2}% ' haddock.log

      # Coverage counts top-level items, so it says nothing about @since.
      # grep -L lists files *without* a match; any output is a failure.
      - name: Every module carries @since
        run: '! grep -rL "@since" src --include="*.hs" | grep .'

      # cabal check exits 0 while printing warnings, so assert on the output.
      - name: Package metadata is clean
        run: cabal check | grep -q 'No errors or warnings'
